<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue - Network Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        header {
            background: #16213e;
            padding: 15px 20px;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1000;
        }

        h1 {
            font-size: 1.5rem;
            color: #4ecca3;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a, .nav-links button {
            padding: 8px 16px;
            background: #0f3460;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links button:hover {
            background: #1a5490;
        }

        #graph-container {
            width: 100vw;
            height: calc(100vh - 70px);
            position: relative;
        }

        .legend {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0f3460;
            max-width: 250px;
            z-index: 100;
        }

        .legend-title {
            font-weight: 700;
            color: #4ecca3;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0f3460;
            z-index: 100;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #4ecca3;
            margin-bottom: 5px;
        }

        .control-group input[type="range"] {
            width: 200px;
        }

        .control-group button {
            width: 100%;
            padding: 8px;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .control-group button:hover {
            background: #1a5490;
        }

        .node {
            cursor: pointer;
            stroke-width: 2px;
        }

        .node-label {
            font-size: 11px;
            pointer-events: none;
            text-anchor: middle;
            fill: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .link {
            stroke-width: 2px;
            opacity: 0.6;
        }

        .link-label {
            font-size: 9px;
            fill: #aaa;
            text-anchor: middle;
            pointer-events: none;
        }

        .tooltip {
            position: absolute;
            background: rgba(22, 33, 62, 0.98);
            border: 2px solid #4ecca3;
            border-radius: 8px;
            padding: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-title {
            font-weight: 700;
            color: #4ecca3;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .tooltip-content {
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .no-data {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            color: #aaa;
        }

        .no-data h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🕸️ Clue - Network Graph</h1>
        <div class="nav-links">
            <button onclick="loadAndRender()">↻ Refresh</button>
            <a href="clue_tracker_minimal.html">Tracker</a>
            <a href="clue_possibilities_v2.html">Possibilities</a>
            <a href="clue_diagnostic.html">Diagnostic</a>
        </div>
    </header>

    <div id="graph-container"></div>

    <div class="legend">
        <div class="legend-title">Node Types</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #3498db;"></div>
            <span>Players</span>
        </div>
        <div class="legend-title" style="margin-top: 15px;">Card States</div>
        <div class="legend-item">
            <div class="legend-color" style="background: #4caf50;"></div>
            <span>Confirmed</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #3498db;"></div>
            <span>Maybe Shown</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffc107;"></div>
            <span>Possible</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #95a5a6;"></div>
            <span>Eliminated</span>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Link Strength</label>
            <input type="range" id="linkStrength" min="0.1" max="2" step="0.1" value="1">
        </div>
        <div class="control-group">
            <label>Charge Strength</label>
            <input type="range" id="chargeStrength" min="-500" max="-50" step="10" value="-200">
        </div>
        <div class="control-group">
            <label>Zoom Level</label>
            <input type="range" id="zoomLevel" min="0.5" max="3" step="0.1" value="1">
        </div>
        <div class="control-group">
            <button onclick="resetSimulation()">Reset Layout</button>
        </div>
        <div class="control-group">
            <button onclick="autoArrange()">Auto Arrange</button>
        </div>
    </div>

    <div class="tooltip"></div>

    <script>
        const WEAPONS = ["Candlestick", "Dagger", "Lead Pipe", "Revolver", "Rope", "Wrench"];
        const LOCATIONS = ["Kitchen", "Ballroom", "Conservatory", "Dining Room", "Billiard Room", "Library", "Lounge", "Hall", "Study"];

        let game = null;
        let simulation = null;
        let svg = null;
        let g = null; // Group for zoom
        let zoom = null;

        const colors = {
            player: '#3498db',
            suspect: '#e74c3c',
            weapon: '#f39c12',
            location: '#9b59b6',
            solution: '#1abc9c',
            hasLink: '#27ae60',
            maybeLink: '#f39c12',
            notHasLink: '#e74c3c',
            constraintLink: '#9b59b6'
        };

        function loadGame() {
            const saved = localStorage.getItem('clueGame');
            if (saved) {
                game = JSON.parse(saved);
                return game.players && game.players.length > 0;
            }
            return false;
        }

        function getNodeColor(node) {
            if (node.type === 'player') return colors.player;
            
            // For cards, color based on their state across all players
            // Check if any player has it confirmed
            const someoneHas = game.players.some(p => game.knowledge[p][node.id] === true);
            if (someoneHas) return '#4caf50'; // Green - confirmed owned
            
            // Check if it's in solution
            const inSolution = ['suspect', 'weapon', 'location'].some(type => 
                game.solutionMustBe[type].includes(node.id)
            );
            if (inSolution) return '#4caf50'; // Green - confirmed solution
            
            // Check if it's in a constraint (maybe)
            const inConstraint = game.showConstraints && game.showConstraints.some(c => 
                !c.resolved && c.cards.includes(node.id)
            );
            if (inConstraint) return '#3498db'; // Blue - maybe shown
            
            // Check if all players have marked it false
            const allEliminated = game.players.every(p => game.knowledge[p][node.id] === false);
            if (allEliminated) return '#95a5a6'; // Gray - eliminated/unknown
            
            // Otherwise it's possible
            return '#ffc107'; // Yellow - possible
        }

        function getNodeSize(node) {
            if (node.type === 'player') return 15;
            if (node.type === 'solution') return 20;
            return 10;
        }

        function getLinkColor(link) {
            if (link.type === 'has') return colors.hasLink;
            if (link.type === 'maybe') return colors.maybeLink;
            if (link.type === 'constraint') return colors.constraintLink;
            return colors.notHasLink;
        }

        function createGraphData() {
            const nodes = [];
            const links = [];

            // Add player nodes
            game.players.forEach(player => {
                nodes.push({
                    id: player,
                    type: 'player',
                    label: player
                });
            });

            // Add card nodes (no solution node needed)
            const allCards = [...game.suspects, ...WEAPONS, ...LOCATIONS];
            allCards.forEach(card => {
                nodes.push({
                    id: card,
                    type: 'card',
                    label: card
                });
            });

            // Add links for player-card relationships
            game.players.forEach(player => {
                allCards.forEach(card => {
                    const state = game.knowledge[player][card];
                    if (state === true) {
                        links.push({
                            source: player,
                            target: card,
                            type: 'has',
                            label: '✓'
                        });
                    } else if (state === 'maybe') {
                        links.push({
                            source: player,
                            target: card,
                            type: 'maybe',
                            label: '?'
                        });
                    }
                });
            });

            // Add constraint links
            if (game.showConstraints) {
                game.showConstraints.forEach((constraint, idx) => {
                    if (!constraint.resolved) {
                        constraint.cards.forEach(card => {
                            if (game.knowledge[constraint.player][card] !== false) {
                                links.push({
                                    source: constraint.player,
                                    target: card,
                                    type: 'constraint',
                                    label: 'C' + (idx + 1)
                                });
                            }
                        });
                    }
                });
            }

            return { nodes, links };
        }

        function renderGraph() {
            const container = document.getElementById('graph-container');
            container.innerHTML = '';

            const width = container.clientWidth;
            const height = container.clientHeight;

            svg = d3.select('#graph-container')
                .append('svg')
                .attr('width', '100%')
                .attr('height', '100%')
                .attr('viewBox', `0 0 ${width} ${height}`)
                .attr('preserveAspectRatio', 'xMidYMid meet');

            // Create zoom behavior
            zoom = d3.zoom()
                .scaleExtent([0.5, 3])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);

            // Create a group for all graph elements (so zoom applies to everything)
            g = svg.append('g');

            const { nodes, links } = createGraphData();

            // Create simulation with proper width/height
            simulation = d3.forceSimulation(nodes)
                .force('link', d3.forceLink(links).id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-200))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30))
                .force('x', d3.forceX(width / 2).strength(0.05))
                .force('y', d3.forceY(height / 2).strength(0.05));

            // Create links
            const link = g.append('g')
                .selectAll('line')
                .data(links)
                .enter()
                .append('line')
                .attr('class', 'link')
                .attr('stroke', d => getLinkColor(d))
                .attr('stroke-dasharray', d => d.type === 'constraint' ? '5,5' : null);

            // Create link labels
            const linkLabel = g.append('g')
                .selectAll('text')
                .data(links)
                .enter()
                .append('text')
                .attr('class', 'link-label')
                .text(d => d.label || '');

            // Create nodes
            const node = g.append('g')
                .selectAll('circle')
                .data(nodes)
                .enter()
                .append('circle')
                .attr('class', 'node')
                .attr('r', d => getNodeSize(d))
                .attr('fill', d => getNodeColor(d))
                .attr('stroke', '#fff')
                .call(drag(simulation));

            // Create node labels
            const nodeLabel = g.append('g')
                .selectAll('text')
                .data(nodes)
                .enter()
                .append('text')
                .attr('class', 'node-label')
                .text(d => d.label);

            // Tooltip
            const tooltip = d3.select('.tooltip');

            node.on('mouseover', function(event, d) {
                let content = `<div class="tooltip-title">${d.label}</div><div class="tooltip-content">`;
                
                if (d.type === 'player') {
                    const allCards = [...game.suspects, ...WEAPONS, ...LOCATIONS];
                    const confirmedCards = allCards.filter(c => game.knowledge[d.id][c] === true);
                    const maybeCards = allCards.filter(c => game.knowledge[d.id][c] === 'maybe');
                    
                    content += `<strong>Confirmed Cards:</strong><br>${confirmedCards.length > 0 ? confirmedCards.join(', ') : 'None'}<br>`;
                    if (maybeCards.length > 0) {
                        content += `<strong>Maybe Cards:</strong><br>${maybeCards.join(', ')}`;
                    }
                } else if (d.type === 'card') {
                    const whoHas = game.players.find(p => game.knowledge[p][d.id] === true);
                    if (whoHas) {
                        content += `<strong>Owner:</strong> ${whoHas}`;
                    } else {
                        const possibleOwners = game.players.filter(p => 
                            game.knowledge[p][d.id] !== false
                        );
                        
                        // Check if in solution
                        const cardType = game.suspects.includes(d.id) ? 'suspect' : 
                                       WEAPONS.includes(d.id) ? 'weapon' : 'location';
                        const inSolution = game.solutionMustBe[cardType] && 
                                         game.solutionMustBe[cardType].includes(d.id);
                        
                        if (inSolution) {
                            content += `<strong>⭐ IN SOLUTION ⭐</strong>`;
                        } else if (possibleOwners.length > 0) {
                            content += `<strong>Possible Owners:</strong><br>${possibleOwners.join(', ')}`;
                        } else {
                            content += `<strong>Eliminated by all players</strong>`;
                        }
                    }
                }
                
                content += '</div>';
                tooltip.html(content)
                    .classed('visible', true)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY + 10) + 'px');
            })
            .on('mouseout', function() {
                tooltip.classed('visible', false);
            });

            // Update positions on each tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                linkLabel
                    .attr('x', d => (d.source.x + d.target.x) / 2)
                    .attr('y', d => (d.source.y + d.target.y) / 2);

                node
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                nodeLabel
                    .attr('x', d => d.x)
                    .attr('y', d => d.y + 25);
            });

            // Add control listeners
            document.getElementById('linkStrength').addEventListener('input', function(e) {
                simulation.force('link').strength(parseFloat(e.target.value) / 10);
                simulation.alpha(0.3).restart();
            });

            document.getElementById('chargeStrength').addEventListener('input', function(e) {
                simulation.force('charge').strength(parseFloat(e.target.value));
                simulation.alpha(0.3).restart();
            });

            document.getElementById('zoomLevel').addEventListener('input', function(e) {
                const scale = parseFloat(e.target.value);
                svg.transition().duration(300).call(
                    zoom.transform,
                    d3.zoomIdentity.translate(width / 2, height / 2).scale(scale).translate(-width / 2, -height / 2)
                );
            });
        }

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended);
        }

        function resetSimulation() {
            if (simulation) {
                simulation.alpha(1).restart();
            }
        }

        function autoArrange() {
            if (!simulation) return;

            const container = document.getElementById('graph-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const nodes = simulation.nodes();
            
            // Separate nodes by type
            const playerNodes = nodes.filter(n => n.type === 'player');
            const cardNodes = nodes.filter(n => n.type === 'card');

            // Categorize cards
            const suspects = cardNodes.filter(n => game.suspects.includes(n.id));
            const weapons = cardNodes.filter(n => WEAPONS.includes(n.id));
            const locations = cardNodes.filter(n => LOCATIONS.includes(n.id));

            // Position players at the top
            const playerSpacing = width / (playerNodes.length + 1);
            playerNodes.forEach((node, i) => {
                node.fx = playerSpacing * (i + 1);
                node.fy = 100;
            });

            // Position cards below in three rows (suspects, weapons, locations)
            const cardStartY = 250;
            const rowSpacing = 150;

            // Position suspects
            const suspectSpacing = width / (suspects.length + 1);
            suspects.forEach((node, i) => {
                node.fx = suspectSpacing * (i + 1);
                node.fy = cardStartY;
            });

            // Position weapons
            const weaponSpacing = width / (weapons.length + 1);
            weapons.forEach((node, i) => {
                node.fx = weaponSpacing * (i + 1);
                node.fy = cardStartY + rowSpacing;
            });

            // Position locations
            const locationSpacing = width / (locations.length + 1);
            locations.forEach((node, i) => {
                node.fx = locationSpacing * (i + 1);
                node.fy = cardStartY + rowSpacing * 2;
            });

            // Restart simulation with fixed positions
            simulation.alpha(0.3).restart();

            // After a delay, release the fixed positions so nodes can be dragged
            setTimeout(() => {
                nodes.forEach(node => {
                    node.fx = null;
                    node.fy = null;
                });
            }, 1000);
        }

        function renderNoData() {
            document.getElementById('graph-container').innerHTML = `
                <div class="no-data">
                    <h2>No Game Data Found</h2>
                    <p>Please start a game in the main tracker first.</p>
                </div>
            `;
        }

        function loadAndRender() {
            if (loadGame()) {
                renderGraph();
            } else {
                renderNoData();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAndRender();
            // No auto-refresh - only updates when you click the refresh button
        });
    </script>
</body>
</html>
